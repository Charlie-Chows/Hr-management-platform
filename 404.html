<!-- 404.html -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1F150C">
  <meta name="description" content="This page could not be found — Stackly HR.">
  <meta name="robots" content="noindex">
  <title>Page not found — Stackly HR</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="global.css">
  <style>
    :root {
      --color-espresso: #1F150C;
      --color-brown: #8B5E3C;
      --color-parchment: #E1DCC9;
      --color-bg: #E7DFC6;
      --color-surface: #EDE7D4;
      --color-muted: #5C4B3C;
      --color-border: rgba(31, 21, 12, 0.15);
      --font-display: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
      --font-body: "Inter", system-ui, -apple-system, sans-serif;
      --transition-base: .32s cubic-bezier(.22, 1, .36, 1);
    }
    *, *::before, *::after { box-sizing: border-box; }
    /* ---------- 404 page ---------- */
    html, body {
      margin: 0;
      padding: 0;
      background: var(--color-bg);
      color: var(--color-espresso);
      font-family: var(--font-body);
      -webkit-font-smoothing: antialiased;
      height: 100vh;
      height: 100dvh;
      overflow: hidden !important;
      overscroll-behavior: none;
    }
    .btn {
      min-height: 52px; display: inline-flex; justify-content: center; align-items: center; gap: 14px;
      padding: 14px 22px; border: 1px solid var(--color-espresso); border-radius: 2px;
      background: var(--color-espresso); color: var(--color-parchment); font-weight: 700;
      font-size: .88rem; cursor: pointer; text-decoration: none;
      transition: background var(--transition-base), color var(--transition-base), transform var(--transition-base), border-color var(--transition-base);
    }
    .btn:hover { background: var(--color-brown); border-color: var(--color-brown); transform: translateY(-2px); }
    .btn--outline { color: var(--color-espresso); background: transparent; }
    .btn--outline:hover { color: var(--color-parchment); background: var(--color-espresso); border-color: var(--color-espresso); }
    .btn__arrow { font-size: 1.1rem; line-height: 1; }
    main {
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
    }
    .not-found {
      height: 100%;
      display: grid;
      place-items: center;
      padding: 24px 0;
      text-align: center;
      overflow: hidden;
    }
    .not-found .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      max-width: 780px;
    }

    .nf-code {
      margin: 0;
      font-family: var(--font-display);
      font-weight: 600;
      font-size: clamp(6rem, min(20vw, 28vh), 16rem);
      line-height: .9;
      letter-spacing: -.08em;
      color: var(--color-espresso);
      position: relative;
      display: inline-block;
    }
    .nf-code em {
      font-style: normal;
      font-weight: 400;
      color: var(--color-brown);
    }

    .not-found h1 {
      margin: clamp(14px, 2.4vh, 28px) 0 0;
      max-width: 720px;
      font-weight: 500;
      font-size: clamp(1.5rem, min(3vw, 4.5vh), 2.85rem);
      line-height: 1.12;
      letter-spacing: -.045em;
    }

    .not-found .lead {
      margin: clamp(12px, 2vh, 24px) auto 0;
      max-width: 540px;
      color: var(--color-muted);
      font-size: clamp(.95rem, min(1.25vw, 2.2vh), 1.15rem);
      line-height: 1.65;
    }

    .nf-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin-top: clamp(22px, 3.5vh, 40px);
    }

    @media (max-width: 520px) {
      .nf-actions { flex-direction: column; width: 100%; max-width: 320px; }
      .nf-actions .btn { width: 100%; }
    }
  </style>
</head>
<body>
  <main id="main">
    <section class="not-found" aria-labelledby="nf-title">
      <div class="container">
        <p class="nf-code reveal-up" aria-hidden="true">4<em>0</em>4</p>

        <h1 id="nf-title" class="reveal-up">This page has wandered off.</h1>

        <p class="lead reveal-up">The link may be old, mistyped, or the page may have moved somewhere quieter. Either way, nothing here is broken that can't be found.</p>

        <div class="nf-actions reveal-up">
          <a class="btn" href="index.html">Back to home <span class="btn__arrow" aria-hidden="true">↗</span></a>
          <button class="btn btn--outline" type="button" id="go-back-btn">Go back <span class="btn__arrow" aria-hidden="true">↗</span></button>
        </div>
      </div>
    </section>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" defer></script>
  <script>
  (() => {
    'use strict';
    const goBackBtn = document.getElementById('go-back-btn');
    if (goBackBtn) {
      goBackBtn.addEventListener('click', () => {
        if (window.history.length > 1) {
          window.history.back();
        } else {
          window.location.href = 'index.html';
        }
      });
    }

    function initMotion() {
      const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (!window.gsap || reduced) return;
      document.documentElement.classList.add('js-motion');
      gsap.fromTo('.reveal-up', { y: 28, opacity: 0 }, {
        y: 0, opacity: 1, duration: .75, stagger: .08, ease: 'power2.out'
      });
    }
    if (document.readyState === 'complete') initMotion();
    else window.addEventListener('load', initMotion, { once: true });
  })();
  </script>
</body>
</html>
